<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #9945FF 0%, #14F195 50%, #00D4FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .logo-subtitle {
            color: #888;
            font-size: 14px;
        }

        .card {
            background: rgba(30, 30, 46, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
            color: #888;
        }

        .tab.active {
            background: linear-gradient(135deg, #9945FF, #14F195);
            color: #fff;
        }

        .tab:not(.active):hover {
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 14px;
            font-family: monospace;
            transition: border-color 0.3s ease;
            resize: none;
        }

        .input-field:focus {
            outline: none;
            border-color: #9945FF;
        }

        .input-field::placeholder {
            color: #555;
        }

        textarea.input-field {
            min-height: 100px;
            line-height: 1.6;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #9945FF, #14F195);
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(153, 69, 255, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #FF6B6B;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .info-text {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="logo">Solana Wallet</div>
            <div class="logo-subtitle">Import your wallet to continue</div>
        </div>

        <div class="card">
            <div class="tabs">
                <div class="tab active" data-tab="seed">Seed Phrase</div>
                <div class="tab" data-tab="private">Private Key</div>
            </div>

            <div id="error" class="error"></div>

            <div id="seed-content" class="tab-content active">
                <div class="input-group">
                    <label class="input-label">Enter your 12 or 24-word seed phrase</label>
                    <textarea id="seed-input" class="input-field" placeholder="word1 word2 word3 ..."></textarea>
                </div>
                <button id="seed-btn" class="btn btn-primary">Import Wallet</button>
            </div>

            <div id="private-content" class="tab-content">
                <div class="input-group">
                    <label class="input-label">Enter your base58 private key</label>
                    <input type="password" id="private-input" class="input-field" placeholder="Enter private key...">
                </div>
                <button id="private-btn" class="btn btn-primary">Import Wallet</button>
            </div>

            <div class="info-text">Your keys are validated locally and never sent anywhere</div>
        </div>
    </div>

        const WORDLIST_SET = new Set(BIP39_WORDLIST);

        // Normalize (NFKD + lowercase)
        function normalizeMnemonic(mnemonic) {
            return mnemonic.normalize('NFKD').toLowerCase().trim();
        }

        // Check if all words are in BIP39 wordlist
        function validateWords(words) {
            for (const word of words) {
                if (!WORDLIST_SET.has(word)) return false;
            }
            return true;
        }

        // UTF-8 encode
        function utf8ToBytes(str) {
            return new TextEncoder().encode(str);
        }

        // PBKDF2 using Web Crypto API
        async function pbkdf2(password, salt, iterations, keyLength) {
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                password,
                'PBKDF2',
                false,
                ['deriveBits']
            );
            const bits = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: iterations,
                    hash: 'SHA-512'
                },
                keyMaterial,
                keyLength * 8
            );
            return new Uint8Array(bits);
        }

        // BIP39 mnemonicToSeed
        async function mnemonicToSeed(mnemonic, passphrase = '') {
            const mnemonicBytes = utf8ToBytes(mnemonic);
            const salt = utf8ToBytes('mnemonic' + passphrase);
            return pbkdf2(mnemonicBytes, salt, 2048, 64);
        }

        // Simple base58 encode
        function base58Encode(bytes) {
            const alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
            let n = BigInt('0x' + Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(''));
            if (n === 0n) return '1';
            let result = '';
            while (n > 0n) {
                const remainder = n % 58n;
                result = alphabet[Number(remainder)] + result;
                n = n / 58n;
            }
            // Count leading zeros
            let i = 0;
            const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            while (i < bytes.length && view.getUint8(i) === 0) {
                result = '1' + result;
                i++;
            }
            return result;
        }

        // Simple base58 decode
        function base58Decode(str) {
            const alphabet = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
            const map = {};
            for (let i = 0; i < alphabet.length; i++) map[alphabet[i]] = i;
            let result = [0];
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (map[char] === undefined) throw new Error('Invalid base58 character: ' + char);
                let carry = map[char];
                for (let j = 0; j < result.length; j++) {
                    carry += result[j] * 58;
                    result[j] = carry % 256;
                    carry = Math.floor(carry / 256);
                }
                while (carry > 0) {
                    result.push(carry % 256);
                    carry = Math.floor(carry / 256);
                }
            }
            // Remove leading zeros
            let i = 0;
            while (i < str.length && str[i] === '1') {
                result.unshift(0);
                i++;
            }
            return new Uint8Array(result);
        }

        // SHA-512 using Web Crypto API
        async function sha512(data) {
            const hashBuffer = await crypto.subtle.digest('SHA-512', data);
            return new Uint8Array(hashBuffer);
        }

        // HMAC-SHA512 using Web Crypto API
        async function hmacSha512(key, data) {
            const cryptoKey = await crypto.subtle.importKey(
                'raw', key,
                { name: 'HMAC', hash: 'SHA-512 },
                false, ['sign']
            );
            const signature = await crypto.subtle.sign('HMAC', cryptoKey, data);
            return new Uint8Array(signature);
        }

        // SLIP-0010 derive hardened child key
        // Returns { key: Uint8Array(32), chainCode: Uint8Array(32) }
        async function slip0010HardenedDerive(seed, index) {
            const IL = utf8ToBytes('ed25519 seed');
            const data = new Uint8Array(37);
            data[0] = 0x00;
            data.set(seed, 1);
            // index as 4-byte big-endian hardened (add 0x80000000)
            const hardenedIndex = (index + 0x80000000) >>> 0;
            data[33] = (hardenedIndex >>> 24) & 0xff;
            data[34] = (hardenedIndex >>> 16) & 0xff;
            data[35] = (hardenedIndex >>> 8) & 0xff;
            data[36] = hardenedIndex & 0xff;

            const I = await hmacSha512(IL, data);
            return {
                key: I.slice(0, 32),
                chainCode: I.slice(32, 64)
            };
        }

        // BIP44 path: m/44'/501'/0'/0'
        // BIP44 path: m/44'/501'/0'  (Solana uses 3 hardened steps, not 4)
        async function deriveSolanaKeypair(seed) {
            let result = await slip0010HardenedDerive(seed, 44);
            result = await slip0010HardenedDerive(result.key, 501);
            result = await slip0010HardenedDerive(result.key, 0);
            return { key: result.key, chainCode: result.chainCode };
        }

        // Validate BIP39 checksum for 12-word (128 bit entropy + 4 bit checksum = 132 bits)
        async function validateChecksum(words) {
            // Build entropy from word indices (11 bits each)
            let bits = '';
            const wordlist = BIP39_WORDLIST;
            for (const w of words) {
                const idx = wordlist.indexOf(w);
                bits += idx.toString(11).padStart(11, '0');
            }

            const entropyBits = words.length === 12 ? 128 : 256;
            const checksumBits = words.length === 12 ? 4 : 8;
            const totalBits = entropyBits + checksumBits;

            const entropyBytes = Math.floor(entropyBits / 8);
            const entropy = new Uint8Array(entropyBytes);
            for (let i = 0; i < entropyBits; i++) {
                const byteIdx = Math.floor(i / 8);
                const bitIdx = 7 - (i % 8);
                if (bits[i] === '1') {
                    entropy[byteIdx] |= (1 << bitIdx);
                }
            }

            // Compute checksum
            const hash = await sha512(entropy);
            const checksum = hash[0];

            // Extract checksum from last bits
            let expectedChecksum = 0;
            for (let i = 0; i < checksumBits; i++) {
                const bitPos = entropyBits + i;
                const byteIdx = Math.floor(bitPos / 8);
                const bitIdx = 7 - (bitPos % 8);
                if (bits[bitPos] === '1') {
                    expectedChecksum |= (1 << (checksumBits - 1 - i));
                }
            }

            // Compare
            const actualChecksum = checksum >> (8 - checksumBits);
            return actualChecksum === expectedChecksum;
        }

        // Derive keypair from seed phrase (async)
        async function deriveKeypairFromSeedAsync(seedPhrase) {
            const normalized = normalizeMnemonic(seedPhrase);
            const words = normalized.split(/\s+/);

            if (words.length !== 12 && words.length !== 24) {
                throw new Error('Seed phrase must be 12 or 24 words');
            }

            // Validate all words are in BIP39 wordlist
            if (!validateWords(words)) {
                throw new Error('Invalid seed phrase words');
            }

            // Validate checksum
            const checksumValid = await validateChecksum(words);
            if (!checksumValid) {
                throw new Error('Invalid seed phrase checksum');
            }

            // Derive seed using PBKDF2
            const seed = await mnemonicToSeed(normalized);
            const derived = await deriveSolanaKeypair(seed);

            return nacl.sign.keyPair.fromSeed(derived.key);
        }

        // Derive keypair from private key (sync)
        function deriveKeypairFromPrivateKey(privateKeyStr) {
            const privateKeyBytes = base58Decode(privateKeyStr.trim());

            if (privateKeyBytes.length !== 64 && privateKeyBytes.length !== 32) {
                throw new Error('Private key must be 64 or 32 bytes');
            }

            const seed = privateKeyBytes.length === 64
                ? privateKeyBytes.slice(0, 32)
                : privateKeyBytes;

            return nacl.sign.keyPair.fromSeed(seed);
        }

        // Get public key as base58
        function getPublicKeyBase58(publicKey) {
            return base58Encode(publicKey);
        }

        // Show error
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Hide error
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        // Import wallet
        async function importWallet(type) {
            hideError();
            const btn = document.getElementById(type === 'seed' ? 'seed-btn' : 'private-btn');
            btn.disabled = true;
            btn.textContent = 'Importing...';

            try {
                let keypair;

                if (type === 'seed') {
                    const seedInput = document.getElementById('seed-input').value.trim();
                    if (!seedInput) {
                        throw new Error('Please enter your seed phrase');
                    }
                    keypair = await deriveKeypairFromSeedAsync(seedInput);
                } else {
                    const privateInput = document.getElementById('private-input').value.trim();
                    if (!privateInput) {
                        throw new Error('Please enter your private key');
                    }
                    keypair = deriveKeypairFromPrivateKey(privateInput);
                }

                const publicKeyBase58 = getPublicKeyBase58(keypair.publicKey);

                // Save to sessionStorage
                sessionStorage.setItem('walletPublicKey', publicKeyBase58);
                sessionStorage.setItem('walletConnected', 'true');

                // Redirect to dashboard
                window.location.href = 'dashboard.html';

            } catch (error) {
                showError(error.message || 'Invalid key. Please check and try again.');
                btn.disabled = false;
                btn.textContent = 'Import Wallet';
            }
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                const tabName = tab.dataset.tab;
                document.getElementById(`${tabName}-content`).classList.add('active');
                hideError();
            });
        });

        // Button handlers
        document.getElementById('seed-btn').addEventListener('click', () => importWallet('seed'));
        document.getElementById('private-btn').addEventListener('click', () => importWallet('private'));

        // Handle Enter key in inputs
        document.getElementById('seed-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                importWallet('seed');
            }
        });

        document.getElementById('private-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                importWallet('private');
            }
        });
    })();
    </script>
